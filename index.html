    <!-- ─── Structured data: SoftwareApplication schema ──────────────────
         Helps Google show the app in rich results with category, pricing,
         operating systems, and the parent organization. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "SoftwareApplication",
          "name": "AutoBook by NEJ",
          "alternateName": ["AutoBook", "AutoBook Photobook Designer"],
          "url": "https://autobookbynej.online/",
          "applicationCategory": "DesignApplication",
          "applicationSubCategory": "Photobook Designer",
          "operatingSystem": "Web, macOS, Windows",
          "description": "The fastest photobook designer for wedding, portrait, and event photographers. Auto-layouts hundreds of photos into print-ready albums in minutes.",
          "image": "https://autobookbynej.online/og-image.png",
          "screenshot": "https://autobookbynej.online/og-image.png",
          "softwareVersion": "1.0",
          "inLanguage": "en",
          "offers": [
            { "@type": "Offer", "name": "Free Trial", "price": "0", "priceCurrency": "USD" },
            { "@type": "Offer", "name": "Starter", "price": "5", "priceCurrency": "USD" },
            { "@type": "Offer", "name": "Pro (one-time)", "price": "29", "priceCurrency": "USD" }
          ],
          "featureList": [
            "Auto-layout — fill a whole book from a folder of photos in one click",
            "Templates for wedding, portrait, event, and studio books",
            "Square, Landscape, Portrait, and Panoramic spread sizes up to 30×12 inches",
            "Print-ready 300 DPI JPG and PDF export with bleed + crop marks",
            "Per-spread client proofing share links with feedback notes",
            "Multi-currency Paystack checkout (USD, NGN, ZAR, GHS, KES)",
            "Desktop apps for macOS and Windows",
            "Offline-first autosave to IndexedDB — never lose work on refresh"
          ],
          "publisher": {
            "@type": "Organization",
            "name": "OctaveDev",
            "url": "https://autobookbynej.online/",
            "description": "OctaveDev builds production-grade software, websites, and apps for brands. AutoBook by NEJ is OctaveDev's photobook designer for studio photographers."
          }
        },
        {
          "@type": "WebSite",
          "name": "AutoBook by NEJ",
          "url": "https://autobookbynej.online/",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://autobookbynej.online/?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What is the fastest way to design a wedding photobook?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "AutoBook by NEJ designs an entire wedding album from a folder of photos in one click. The auto-layout engine picks templates per spread, places photos by orientation and composition, and produces print-ready output in minutes instead of days."
              }
            },
            {
              "@type": "Question",
              "name": "Can clients leave feedback on each spread?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. Share a read-only proofing link with your client. They can leave a note on any spread; you receive each note by email and see them grouped by spread inside the editor."
              }
            },
            {
              "@type": "Question",
              "name": "Does AutoBook export print-ready files?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Every export is 300 DPI with bleed and crop marks. Choose JPGs (one per spread) for print labs that take images, or a single PDF for print shops that need a multi-page document."
              }
            },
            {
              "@type": "Question",
              "name": "Is there a desktop app?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. Pro subscribers can install native apps for macOS (Apple Silicon and Intel) and Windows. The desktop apps run fully offline once installed."
              }
            }
          ]
        }
      ]
    }
    </script>
