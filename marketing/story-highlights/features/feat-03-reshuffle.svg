<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <rect width="1080" height="1920" fill="#0a0a0a"/>

  <text x="120" y="330"
        font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="32" font-weight="600" fill="#666" letter-spacing="4">02 / 03  ·  FEATURE</text>

  <text x="120" y="780"
        font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="160" font-weight="800" fill="#ffffff" letter-spacing="-6">Reshuffle.</text>

  <line x1="120" y1="860" x2="280" y2="860" stroke="#ffffff" stroke-width="6"/>

  <g font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
     fill="#dddddd" font-size="50" font-weight="400">
    <text x="120" y="990">Don't love a spread?</text>
    <text x="120" y="1060">Tap once. A new layout —</text>
    <text x="120" y="1130">same photos, fresh feel.</text>
  </g>

  <!-- Mini visual: two spread variants connected by an arrow -->
  <g transform="translate(120 1260)">
    <!-- variant A -->
    <rect x="0" y="0" width="180" height="220" rx="8" fill="none" stroke="#333" stroke-width="2"/>
    <rect x="20" y="20" width="140" height="90" fill="#444"/>
    <rect x="20" y="120" width="65" height="80" fill="#444"/>
    <rect x="95" y="120" width="65" height="80" fill="#444"/>

    <!-- arrow with curved swap -->
    <g transform="translate(230 110)" stroke="#888" stroke-width="3" fill="none">
      <path d="M 0 -10 L 100 -10 M 85 -25 L 100 -10 L 85 5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 100 30 L 0 30 M 15 15 L 0 30 L 15 45" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- variant B -->
    <rect x="380" y="0" width="180" height="220" rx="8" fill="none" stroke="#ffffff" stroke-width="2"/>
    <rect x="400" y="20" width="65" height="100" fill="#ffffff"/>
    <rect x="475" y="20" width="65" height="100" fill="#ffffff"/>
    <rect x="400" y="130" width="140" height="70" fill="#ffffff"/>

    <!-- arrow -->
    <g transform="translate(610 110)" stroke="#888" stroke-width="3" fill="none">
      <path d="M 0 -10 L 100 -10 M 85 -25 L 100 -10 L 85 5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 100 30 L 0 30 M 15 15 L 0 30 L 15 45" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- variant C -->
    <rect x="760" y="0" width="180" height="220" rx="8" fill="none" stroke="#333" stroke-width="2"/>
    <rect x="780" y="20" width="140" height="180" fill="#444"/>
  </g>

  <text x="540" y="1670" text-anchor="middle"
        font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="32" font-weight="500" fill="#888">As many tries as you want. Zero re-import.</text>
</svg>
