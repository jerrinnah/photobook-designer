<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <rect width="1080" height="1920" fill="#0a0a0a"/>

  <text x="540" y="350" text-anchor="middle"
        font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="28" font-weight="600" fill="#888" letter-spacing="6">WHO IT'S FOR</text>

  <!-- Big quote-style line -->
  <g font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" fill="#ffffff" text-anchor="middle">
    <text x="540" y="850"  font-size="92" font-weight="700" letter-spacing="-3">Photographers</text>
    <text x="540" y="970"  font-size="92" font-weight="700" letter-spacing="-3">who'd rather</text>
    <text x="540" y="1090" font-size="92" font-weight="700" letter-spacing="-3" fill="#ffffff">
      <tspan>shoot </tspan><tspan fill="#666">than</tspan>
    </text>
    <text x="540" y="1210" font-size="92" font-weight="700" letter-spacing="-3">design.</text>
  </g>

  <!-- Audience chips -->
  <g transform="translate(540 1430)" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
     font-size="32" font-weight="600" fill="#ffffff">
    <g transform="translate(-340 0)">
      <rect x="0" y="-46" width="260" height="80" rx="40" fill="none" stroke="#444" stroke-width="2"/>
      <text x="130" y="10" text-anchor="middle">Wedding</text>
    </g>
    <g transform="translate(-60 0)">
      <rect x="0" y="-46" width="200" height="80" rx="40" fill="none" stroke="#444" stroke-width="2"/>
      <text x="100" y="10" text-anchor="middle">Event</text>
    </g>
    <g transform="translate(160 0)">
      <rect x="0" y="-46" width="240" height="80" rx="40" fill="none" stroke="#444" stroke-width="2"/>
      <text x="120" y="10" text-anchor="middle">Portrait</text>
    </g>
  </g>

  <text x="540" y="1670" text-anchor="middle"
        font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="26" font-weight="500" fill="#666" letter-spacing="4">LINK IN BIO  ·  AUTOBOOKBYNEJ.ONLINE</text>
</svg>
