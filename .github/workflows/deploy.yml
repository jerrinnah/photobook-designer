name: Build and FTP deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build site
        run: npm run build
        # Vite reads VITE_* vars from .env.production (already committed).
        # Override here if you ever rotate the anon key.

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ${{ secrets.FTP_PROTOCOL }}   # ftp | ftps | ftps-legacy
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_REMOTE_PATH }}
          # Don't wipe other files in public_html — only replace what changed
          dangerous-clean-slate: false
          # Skip files that haven't changed (faster deploys)
          state-name: .ftp-deploy-sync-state.json
          log-level: standard
